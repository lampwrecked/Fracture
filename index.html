<script>
(()=>{
'use strict';
/* ===== constants ===== */
const TAU=Math.PI*2, BPM=174, STEPS=64, STEP=60/BPM/4, LOOP=STEP*STEPS, MAXV=24;
const $=id=>document.getElementById(id);
const cv=$('c');
const g=cv.getContext('2d',{willReadFrequently:true,alpha:false});
const coarse=matchMedia('(pointer:coarse)').matches;
const SIM_LONG=coarse?1200:1600;
let simLong=SIM_LONG,K=simLong/1600;
let simW=0,simH=0;
let rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GT=4*60/BPM;                       /* growth time constant = 4 beats */
const growth=t=>1-Math.exp(-t/GT);
const rad=(p,maxR)=>maxR*(.1+.9*p);
const MAXR=()=>.85*Math.hypot(simW,simH);

/* ===== sim canvas ===== */
function calcSim(){
  const iw=innerWidth,ih=innerHeight;
  if(iw>=ih){simW=simLong;simH=Math.max(2,Math.round(simLong*ih/iw));}
  else{simH=simLong;simW=Math.max(2,Math.round(simLong*iw/ih));}
}
calcSim();
cv.width=simW;cv.height=simH;
g.fillStyle='#000';g.fillRect(0,0,simW,simH);g.imageSmoothingEnabled=false;
/* every effect that moves pixels around reads from this frame-start snapshot. drawing a canvas onto ITSELF makes the
   browser copy the entire canvas on every single call (dozens per frame = the lag), a separate source canvas does not. */
const SNc=document.createElement('canvas'),sn=SNc.getContext('2d',{alpha:false});
function syncSnap(){if(SNc.width!==simW||SNc.height!==simH){SNc.width=simW;SNc.height=simH;}sn.drawImage(cv,0,0);}
syncSnap();
function resize(){
  const old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;
  old.getContext('2d').drawImage(cv,0,0);
  calcSim();cv.width=simW;cv.height=simH;
  g.fillStyle='#000';g.fillRect(0,0,simW,simH);g.imageSmoothingEnabled=false;
  g.drawImage(old,0,0,simW,simH);
  syncSnap();
}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,150);});

/* ===== fracture geometry: linear, branching cracks that cross and break through each other ===== */
const world=[];let crackId=1,uidN=0,wgrid=new Map();
const GC=64,gridKey=(cx,cy)=>(cx+16)*256+(cy+16);
function rebuildGrid(){
  wgrid=new Map();
  for(let i=0;i<world.length;i++){
    const s=world[i],x0=Math.floor(Math.min(s[0],s[2])/GC),x1=Math.floor(Math.max(s[0],s[2])/GC),y0=Math.floor(Math.min(s[1],s[3])/GC),y1=Math.floor(Math.max(s[1],s[3])/GC);
    for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const k=gridKey(cx,cy);let a=wgrid.get(k);if(!a){a=[];wgrid.set(k,a);}a.push(s);}
  }
}
function clearWorld(){world.length=0;wgrid=new Map();}
/* a layer's cracks live in the world while it is on canvas; a replay swaps its old cracks for its newly grown ones */
function touchWorld(geo,owner){
  const now=performance.now()/1000;
  let keep=world.filter(s=>s[6]!==owner&&now-s[5]<=14);
  for(const q of geo.own)keep.push([q[0],q[1],q[2],q[3],q[4],now,owner]);
  if(keep.length>12000)keep=keep.slice(keep.length-12000);
  world.length=0;for(let i=0;i<keep.length;i++)world.push(keep[i]);
  rebuildGrid();
}
function findHit(x1,y1,x2,y2,id,own,owner){
  let bt=2,bx=0,by=0,ba=0;
  const minx=Math.min(x1,x2),maxx=Math.max(x1,x2),miny=Math.min(y1,y2),maxy=Math.max(y1,y2),dx=x2-x1,dy=y2-y1;
  const test=s=>{
    const x3=s[0],y3=s[1],x4=s[2],y4=s[3];
    if((x3<minx&&x4<minx)||(x3>maxx&&x4>maxx)||(y3<miny&&y4<miny)||(y3>maxy&&y4>maxy))return;
    const ex=x4-x3,ey=y4-y3,d=dx*ey-dy*ex;
    if(d>-1e-6&&d<1e-6)return;
    const t=((x3-x1)*ey-(y3-y1)*ex)/d,u=((x3-x1)*dy-(y3-y1)*dx)/d;
    if(t>.03&&t<=1&&u>=0&&u<=1&&t<bt){bt=t;bx=x1+dx*t;by=y1+dy*t;ba=Math.atan2(ey,ex);}
  };
  for(let i=0;i<own.length;i++){const s=own[i];if(s[4]!==id)test(s);}
  const cx0=Math.floor(minx/GC),cx1=Math.floor(maxx/GC),cy0=Math.floor(miny/GC),cy1=Math.floor(maxy/GC);
  for(let cx=cx0;cx<=cx1;cx++)for(let cy=cy0;cy<=cy1;cy++){
    const a=wgrid.get(gridKey(cx,cy));
    if(a)for(let i=0;i<a.length;i++){const s=a[i];if(s[6]!==owner)test(s);}
  }
  return bt<=1?{x:bx,y:by,ang:ba,d:bt*Math.hypot(dx,dy)}:null;
}
function build(ox,oy,seed,maxR,owner,gen){
  const gf=1+Math.min(gen||0,8)*.1;
  const rng=mulberry32(seed),segs=[],cells=[],nodes=[],own=[],hyp=Math.hypot(simW,simH),MAXSEG=800;
  const add=(x1,y1,x2,y2,pl,w,h,id)=>{segs.push([x1,y1,x2,y2,pl,w,h]);own.push([x1,y1,x2,y2,id,w,pl]);};
  function slab(trail,pl,h){
    const a=trail[0],b=trail[trail.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,s=rng()<.5?-1:1,wd=(8+rng()*52)*K,nx=-dy/L*s*wd,ny=dx/L*s*wd;
    const pts=trail.map(p=>[p[0],p[1]]);
    for(let i=trail.length-1;i>=0;i--)pts.push([trail[i][0]+nx,trail[i][1]+ny]);
    let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1];});
    cells.push({pts,d:pl,cx:cx/pts.length,cy:cy/pts.length,ang:Math.atan2(dy,dx),lit:rng()<.5,al:.08+rng()*.2,h:(rng()-.5)*120});
  }
  function branch(x,y,a,rem,w,h,depth,pl,fork){
    nodes.push({x,y,pl,hd:a,ang:a,t:0});
    const da=(rng()<.5?-1:1)*(.25+rng()*.95);
    walk(x,y,a+da,Math.max(hyp*.05,rem*(.25+rng()*.4)),w*.72,h+(rng()-.5)*40,depth+1,pl,0,fork);
  }
  function walk(x,y,a,len,w,h,depth,pl0,straight,fork){
    const id=crackId++;
    let pl=pl0,run=0,cd=depth?2:0;
    const jit=straight?.012:.1,kink=straight?.01:.06,trail=[[x,y]];
    while(run<len&&segs.length<MAXSEG){
      const st=(14+rng()*26)*K;
      a+=(rng()-.5)*jit;
      if(rng()<kink)a+=(rng()<.5?-1:1)*(.25+rng()*.45);
      const nx=x+Math.cos(a)*st,ny=y+Math.sin(a)*st,ww=Math.max(.6,w*(1-.5*run/len));
      let hit=null;
      if(cd>0)cd--;else hit=findHit(x,y,nx,ny,id,own,owner);
      if(hit){
        add(x,y,hit.x,hit.y,pl,ww,h,id);pl+=hit.d;run+=hit.d;
        nodes.push({x:hit.x,y:hit.y,pl,hd:a,ang:hit.ang,t:1});
        if(depth>0&&rng()<.22)break;
        const off=(rng()-.5)*(14+rng()*40)*K,jx=hit.x+Math.cos(hit.ang)*off,jy=hit.y+Math.sin(hit.ang)*off;
        add(hit.x,hit.y,jx,jy,pl,ww,h,id);pl+=Math.abs(off);
        x=jx;y=jy;a+=(rng()-.5)*.6;cd=2;trail.length=0;trail.push([x,y]);
        if(depth<3&&rng()<Math.min(.9,.5*gf))branch(x,y,a,len-run,w,h,depth,pl,fork);
        continue;
      }
      add(x,y,nx,ny,pl,ww,h,id);pl+=st;run+=st;x=nx;y=ny;
      trail.push([x,y]);if(trail.length>4)trail.shift();
      if(trail.length>=3&&rng()<.09)slab(trail,pl,h);
      if(depth<3&&rng()<(depth?.07:.09)*fork*gf)branch(x,y,a,len-run,w,h,depth,pl,fork);
      if(x<-80||y<-80||x>simW+80||y>simH+80)break;
    }
  }
  const a0=rng()*TAU,mode=rng(),Lg=()=>hyp*(.4+.55*rng()),hh=()=>(rng()-.5)*90;
  nodes.push({x:ox,y:oy,pl:0,hd:a0,ang:a0,t:0});
  if(mode<.26){            // one straight line through the point
    walk(ox,oy,a0,Lg(),1.9,hh(),0,0,1,1.3);
    walk(ox,oy,a0+Math.PI+(rng()-.5)*.1,Lg(),1.9,hh(),0,0,1,1.3);
  }else if(mode<.52){      // lopsided tree: arms in a random cone, any direction
    const n=3+((rng()*3)|0),cone=.6+rng()*2.6;
    for(let i=0;i<n;i++)walk(ox,oy,a0+(i/(n-1)-.5)*cone+(rng()-.5)*.2,Lg(),1.8,hh(),0,0,0,1);
  }else if(mode<.8){       // crossing lines: one through the point, others cut across it
    const L1=Lg();
    walk(ox,oy,a0,L1,1.9,hh(),0,0,1,.8);
    walk(ox,oy,a0+Math.PI,Lg(),1.9,hh(),0,0,1,.8);
    const n=2+((rng()*3)|0);
    for(let i=0;i<n;i++){
      const s=(rng()-.5)*1.2*L1,off=(rng()<.5?-1:1)*(.05+rng()*.2)*hyp*.5;
      const sx=ox+Math.cos(a0)*s-Math.sin(a0)*off,sy=oy+Math.sin(a0)*s+Math.cos(a0)*off;
      const phi=-Math.sign(off)*(.4+rng()*2.3);
      walk(sx,sy,a0+phi,Lg(),1.6,hh(),0,Math.hypot(sx-ox,sy-oy),1,.8);
    }
  }else{                   // lightning: one-sided trunk, heavy forking
    walk(ox,oy,a0,hyp*(.6+.4*rng()),1.9,hh(),0,0,0,2.3);
    walk(ox,oy,a0+Math.PI+(rng()-.5)*.6,hyp*(.1+.2*rng()),1.5,hh(),0,0,0,1.5);
  }
  touchWorld({own},owner);
  segs.sort((a,b)=>a[4]-b[4]);cells.sort((a,b)=>a.d-b.d);nodes.sort((a,b)=>a.pl-b.pl);
  {const cr=nodes.filter(n=>n.t),keep=Math.min(cr.length,36);
   for(let i=0;i<keep;i++){const n=cr[Math.floor(i*cr.length/keep)];n.fx={s:rng()<.5?-1:1,Wc:(60+rng()*160)*K,Ls:(40+rng()*110)*K,sh:(rng()<.5?-1:1)*(8+rng()*34)*K,R:(20+rng()*40)*K};}}
  let rings=nodes.map(n=>n.pl/maxR).filter(v=>v>.1&&v<1);
  if(rings.length>26){const t=[];for(let i=0;i<26;i++)t.push(rings[Math.floor(i*rings.length/26)]);rings=t;}
  return{segs,cells,nodes,rings,own};
}
/* where a crack crosses another, the older line is sheared along the new crack, plus a spark */
function crossFX(f,n){
  const q=n.fx,u=[Math.cos(n.hd),Math.sin(n.hd)],v=[-u[1],u[0]],s=q.s,Wc=q.Wc,Ls=q.Ls,sh=q.sh;
  const A=[n.x-u[0]*Wc/2,n.y-u[1]*Wc/2],B=[n.x+u[0]*Wc/2,n.y+u[1]*Wc/2];
  const P=[A,B,[B[0]+v[0]*s*Ls,B[1]+v[1]*s*Ls],[A[0]+v[0]*s*Ls,A[1]+v[1]*s*Ls]];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

    case 'sort':hit(hf.frequency,400+q*1900,20,.01,.09);hit(hf.Q,2+q*8,.7);break;

   and at most once every 2 bars however many layers ask for it. */
function stutter(t,depth){

const INST=Object.keys(V);let lastInst='';

/* ===== loop ===== */
let loopT0=null,nextT=0,nextStep=0,loopNo=0;
const events=[],vq=[];

   hold or a fast roll never dumps hundreds of nodes onto the page in a single moment */
const jobs=[];
function playEvent(ev,t){
  curLayer=ev.lg||null;

  const h=V[ev.inst](t,ev.f);
  const job={h,t,ev,i:1,n:Math.floor(ev.dur/STEP),ring:ev.ringT.map((rt,k)=>[rt,k]).filter(r=>r[0]<ev.dur).sort((a,b)=>a[0]-b[0]),ri:0,done:false};

  while(job.ri<job.ring.length&&t+job.ring[job.ri][0]<hz){tickSnd(t+job.ring[job.ri][0],job.ring[job.ri][1]%9);job.ri++;}
  if(job.i>job.n&&job.ri>=job.ring.length&&t+ev.dur<hz+.5){
    const te=t+ev.dur+.002;h.end(te,ev.pEnd);impact(te,ev.pEnd);if(ev.stut)stutter(te);job.done=true;
  }
}
function runJobs(now){

let metOn=false,mNext=0,mBeat=0;const mvq=[],BEAT=4*STEP;
function click(t,acc,first){
  const o=AC.createOscillator(),a=AC.createGain();o.type='square';o.frequency.value=first?2100:acc?1568:1046;
  a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(first?.3:acc?.22:.13,t+.001);a.gain.exponentialRampToValueAtTime(.0004,t+.045);
  o.connect(a);a.connect(master);o.start(t);o.stop(t+.06);   /* straight to master: never in the MP4 */

const LOOKAHEAD=.4;
function sched(){
  if(!AC||loopT0===null)return;

  if(mNext<now-1.5){const b=Math.ceil((now-loopT0)/BEAT);mNext=loopT0+b*BEAT;mBeat=((b%16)+16)%16;}
  while(mNext<now+LOOKAHEAD){
    const acc=mBeat%4===0;
    if(metOn){try{click(Math.max(mNext,now+.002),acc,mBeat===0);}catch(e){}}
    mvq.push({t:mNext,a:acc,f:mBeat===0});mNext+=BEAT;mBeat=(mBeat+1)%16;
  }
  if(nextT<now-1.5){          /* tab slept or the page froze for ages: jump to now instead of replaying a burst of stale steps */
    const g=Math.ceil((now-loopT0)/STEP);nextT=loopT0+g*STEP;nextStep=((g%STEPS)+STEPS)%STEPS;loopNo=Math.floor(g/STEPS);
  }
  while(nextT<now+LOOKAHEAD){

    for(const ev of events){

function recordEvent(f,hold){

let frs=[],shake=0,budget=3;
const held=new Map();
/* every effect a fracture makes is stored as an op (type, place, size, own rng seed),
   so each loop replay re-runs the exact same effects the fracture had when it was made */
function runOp(f,op){
  const old=rnd;rnd=mulberry32(op.s);
  try{
    if(op.k==='rev')reveal(f,op.r);
    else if(op.k==='fl')flash(f,op.r,op.q);
    else{
      const c=Object.create(f);c.x=op.x;c.y=op.y;
      /* a replay's cracks have re-grown, so put the effect on the same part of the NEW crack web */
      if(!f.live&&op.u!==undefined&&f.geo.segs.length){const G=f.geo.segs,sg=G[Math.min(G.length-1,Math.floor(op.u*G.length))];c.x=(sg[0]+sg[2])/2;c.y=(sg[1]+sg[3])/2;}
      if(op.k==='g'){glitch(c,op.n,op.r,op.q);try{audioFX(op.n,op.q);}catch(e){console.warn('fx',e);}}else lightBurst(c,op.r,op.q);
    }
  }finally{rnd=old;}
}
/* replays share a per-frame effect budget: cracks always draw, but when many layers land at once on a slow
   device the extra glitch effects are skipped instead of piling up and freezing the page */
let rbudget=12;

  runOp(f,op);

  f.op(th,'l',null,localR(p),k);f.op(th,'l',null,localR(p),k);

}

  }
}
/* if the window size changed since a fracture was made, scale its stored geometry and ops */
function rescale(ev){      /* window size changed: only the stored effect sizes need scaling, the cracks are re-grown anyway */
  const sx=simW/ev.sw,sy=simH/ev.sh,sa=Math.sqrt(sx*sy);
  ev.ops=ev.ops.map(o=>{const q={...o};if(q.x!==undefined){q.x*=sx;q.y*=sy;}q.r*=sa;return q;});
  ev.sw=simW;ev.sh=simH;

/* every loop a layer comes back with the SAME seed, effects and sound, but its cracks are grown again from scratch:
   they break through whatever fractures are on the canvas now, including ones made after it, and each pass is a
   little denser. so the longer the loop runs, the more crossed and fractured the picture gets, even with no input. */
function spawnReplay(ev){
  if(ev.sw!==simW||ev.sh!==simH)rescale(ev);
  ev.gen=(ev.gen||0)+1;
  const geo=build(ev.x*simW,ev.y*simH,ev.seed,MAXR(),ev.uid,ev.gen);
  ev.geo=geo;
  frs.push(new Fr({x:ev.x*simW,y:ev.y*simH,seed:ev.seed,hue:ev.hue,sat:famSat(ev.inst),inst:ev.inst,live:false,dur:ev.dur,hold:ev.hold,f:ev.f,pressT:0,geo,ops:ev.ops,uid:ev.uid}));
}

/* ===== fade (also keeps the piece from whiting out) ===== */
let fadeSh=7,fcount=0,lumAvg=0,fadeN=0;
function trailEvery(){return 1;}   /* recording captures the live canvas exactly as it looks */
function fadePass(){
  const ev=trailEvery(),decay=ev>0&&(fadeN++%ev)===0;
  const img=g.getImageData(0,0,simW,simH),d=img.data,n=d.length,sh=fadeSh,W=96,gain=lumAvg>62?.86:lumAvg>46?.94:1;
  let sum=0,cnt=0;
  for(let i=0;i<n;i+=4){
    let a=d[i],b=d[i+1],c=d[i+2];
    if(a|b|c){
      const m=a<b?(a<c?a:c):(b<c?b:c);
      if(m>W){const w=(m-W)>>1;a-=w;b-=w;c-=w;}          /* pull white back toward colour */
      if(gain<1){a=(a*gain)|0;b=(b*gain)|0;c=(c*gain)|0;}  /* whole-frame brightness governor */
      if(decay){a-=1+(a>>sh);b-=1+(b>>sh);c-=1+(c>>sh);}
      d[i]=a<0?0:a;d[i+1]=b<0?0:b;d[i+2]=c<0?0:c;
    }
    if((i&255)===0){sum+=(d[i]+d[i+1]+d[i+2])/3;cnt++;}
  }

  lumAvg=cnt?sum/cnt:0;fadeSh=lumAvg>50?4:lumAvg>34?5:lumAvg>20?6:7;
}

/* svg export: the crack geometry of every layer in the loop (plus anything still held), as clean vectors for
   laser engraving. three colour-coded layers so laser software (LightBurn etc.) can give each its own operation:
   CRACKS  black stroke  · continuous polylines, stroke width = crack width (score or line-engrave)
   SLABS   blue fill     · the lit shard planes (fill / raster engrave)
   FRAME   red hairline  · the canvas edge, at screen ratio (cut line or alignment, delete if not needed)
   long side is 300 mm on import; scale to the material in the laser software. */

  const clipSeg=(x1,y1,x2,y2)=>{

function chips(card){
  const u=[...new Set(card.map(l=>RINST[l[0]]))];
  return u.slice(0,3).map(INAME).join(' · ')+(u.length>3?' · +'+(u.length-3):'');
}

/* ---- library panel ---- */
const libEl=$('lib'),grid=$('grid'),sItems=$('sItems');
let libTab='recipes',libOff=0,libOpen=false,strip=[];
const cardIndex={};
function openLib(){initSort();libOpen=true;libEl.classList.remove('hide');$('libMode').textContent=LIB.shared?'SHARED LIBRARY':'THIS DEVICE ONLY · NOT SHARED YET';setTab(libTab);}
function closeLib(){libOpen=false;libEl.classList.add('hide');}
function setTab(t){
  libTab=t;libOff=0;grid.innerHTML='';
  libEl.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  libEl.classList.toggle('songs',t==='songs');
  loadMore();
}
function btn(txt,fn,cls){const b=document.createElement('button');b.textContent=txt;if(cls)b.className=cls;b.onclick=e=>{e.stopPropagation();fn(b);};return b;}
async function loadMore(){
  const more=$('more');more.style.display='none';
  const empty=()=>{if(!grid.children.length){const p=document.createElement('div');p.className='empty';p.textContent=libTab==='songs'?'NO SONGS YET · BUILD ONE ON THE STRIP IN LIBRARY':'NO RECIPES YET · MAKE A LOOP, THEN MENU → SAVE';grid.appendChild(p);}};
  try{
    if(libTab==='recipes'){
      const j=await LIB.listRecipes(libOff);libOff+=j.items.length;
      j.items.forEach(it=>{cardIndex[it.id]=it.card;grid.appendChild(recipeCard(it));});
      more.style.display=j.more?'':'none';
    }else{
      const j=await LIB.listSongs(libOff);libOff+=j.items.length;
      j.items.forEach(s=>grid.appendChild(songRow(s)));
      more.style.display=j.more?'':'none';
    }
  }catch(e){toast('LIBRARY OFFLINE · '+e.message);}
  empty();
}
$('more').onclick=loadMore;
function recipeCard(it){
  const el=document.createElement('div');el.className='card';
  const th=document.createElement('canvas');th.width=320;th.height=200;th.className='th';drawThumb(th,it.card);
  const st=document.createElement('canvas');st.width=320;st.height=28;st.className='st';drawStrip(st,it.card);
  const ch=document.createElement('div');ch.className='chips';ch.textContent=chips(it.card);
  const me=document.createElement('div');me.className='meta';
  me.innerHTML='<b>FRACTURE '+num(it.id)+'</b><span>'+it.card.length+' LAYER'+(it.card.length>1?'S':'')+(it.uses?' · ⟲ '+it.uses:'')+'</span>';
  const ac=document.createElement('div');ac.className='act';
  ac.append(btn('▶',()=>startSong([{c:[[it.id,2]],n:2,t:0}],'FRACTURE '+num(it.id)),'play'),
    btn('＋ CANVAS',()=>addToCanvas(it.id)),
    btn('＋ SONG',()=>{addStrip(it.id,it.card);}),
    btn('＋ LAYER',()=>{addLayer(it.id,it.card);}),
    btn('⚑',b=>report('recipe',it.id,b,el),'rep'));
  if(ADMIN&&API)ac.append(btn('HIDE',()=>LIB.hide('recipe',it.id).then(()=>el.remove()).catch(e=>toast(e.message)),'rep'));
  el.append(th,st,ch,me,ac);
  return el;
}
function songRow(s){
  const el=document.createElement('div');el.className='card song';
  const sec=Math.round(s.loops*LOOP),dots=document.createElement('div');dots.className='dots';
  (s.dots||[]).forEach(sl=>{const c=document.createElement('span');[].concat(sl).forEach(hu=>{const d=document.createElement('i');d.style.background='hsl('+hu+',100%,62%)';c.appendChild(d);});dots.appendChild(c);});
  const me=document.createElement('div');me.className='meta';
  me.innerHTML='<b>SONG '+num(s.id)+'</b><span>'+s.items.length+' SLOT'+(s.items.length>1?'S':'')+' · '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+'</span>';
  const ac=document.createElement('div');ac.className='act';
  ac.append(btn('▶ WATCH',()=>startSong(s.items,'SONG '+num(s.id)),'play'),
    btn('LINK',()=>{const u=location.origin+location.pathname+'?song='+s.id+(QS.get('api')?'&api='+encodeURIComponent(API):'');try{navigator.clipboard.writeText(u);toast('LINK COPIED');}catch(_){toast(u);}}),
    btn('⚑',b=>report('song',s.id,b,el),'rep'));
  if(ADMIN&&API)ac.append(btn('HIDE',()=>LIB.hide('song',s.id).then(()=>el.remove()).catch(e=>toast(e.message)),'rep'));
  el.append(me,dots,ac);
  return el;
}
async function report(kind,id,b,el){
  if(!LIB.shared){toast('REPORTS WORK ONCE THE LIBRARY IS SHARED');return;}
  try{await LIB.report(kind,id);b.disabled=true;b.textContent='⚑ SENT';el.classList.add('reported');}catch(e){toast(e.message);}
}
async function addToCanvas(id){
  try{initAudio();}catch(_){}
  let recs;try{recs=await LIB.recipes([id]);}catch(e){toast('COULD NOT LOAD · '+e.message);return;}
  if(!recs[id])return;
  if(AC&&loopT0===null){const t=AC.currentTime+.1;loopT0=t;nextT=t;nextStep=0;loopNo=0;mNext=t;mBeat=0;}
  const add=decodeRecipe(recs[id],loopT0===null?0:loopNo+1);
  add.forEach(e=>{events.push(e);if(events.length>MAXV)events.shift();});
  hint.style.opacity=0;
  toast('ADDED '+add.length+' LAYERS · ENTER ON THE NEXT LOOP');
}
$('libRand').onclick=async()=>{
  try{const it=await LIB.randomRecipes(1);if(!it.length){toast('LIBRARY IS EMPTY');return;}await addToCanvas(it[0].id);}catch(e){toast(e.message);}
};

/* ---- song strip: slots in order; a slot layers up to 4 cards (48 layers) that play together ---- */
const TR=[0,4,8,16],REP=[1,2,3,4,6,8];
let slotSel=-1;
const slotLayers=sl=>sl.c.reduce((a,x)=>a+x.card.length,0);
function addStrip(id,card,n,t){
  if(strip.length>=64){toast('SONG IS FULL (64 SLOTS)');return;}
  card=card||cardIndex[id]||[];
  strip.push({c:[{r:id,v:2,card}],n:n||1,t:t||0});slotSel=strip.length-1;renderStrip();
  sItems.scrollLeft=sItems.scrollWidth;
}
function addLayer(id,card){
  card=card||cardIndex[id]||[];
  if(!strip.length){addStrip(id,card);return;}
  if(slotSel<0||slotSel>=strip.length)slotSel=strip.length-1;
  const sl=strip[slotSel];
  if(sl.c.some(x=>x.r===id)){toast('ALREADY IN THIS SLOT');return;}
  if(sl.c.length>=MAXCOL){toast('A SLOT HOLDS '+MAXCOL+' CARDS');return;}
  if(slotLayers(sl)+card.length>CAP){toast('TOO MANY LAYERS · '+(slotLayers(sl)+card.length)+'/'+CAP);return;}
  sl.c.push({r:id,v:2,card});renderStrip();toast('LAYERED INTO SLOT '+(slotSel+1));
}
function renderStrip(){
  sItems.innerHTML='';
  if(!strip.length){const p=document.createElement('div');p.className='sempty';p.textContent='SONG STRIP · ＋ SONG STARTS A SLOT · ＋ LAYER STACKS A CARD INTO THE SELECTED SLOT';sItems.appendChild(p);}
  if(slotSel>=strip.length)slotSel=strip.length-1;
  strip.forEach((it,i)=>{
    const el=document.createElement('div');el.className='scard'+(it.n>1?' stack':'');el.dataset.i=i;
    const colEl=document.createElement('div');colEl.className='scol'+(i===slotSel?' sel':'');
    colEl.onclick=()=>{slotSel=i;renderStrip();};
    const hd=document.createElement('div');hd.className='shead';
    const cnt=document.createElement('span');cnt.className='scnt';cnt.textContent=slotLayers(it)+'/'+CAP;
    hd.append(btn('◀',()=>{if(i>0){[strip[i-1],strip[i]]=[strip[i],strip[i-1]];if(slotSel===i)slotSel--;renderStrip();}}),
      btn('▶',()=>{if(i<strip.length-1){[strip[i+1],strip[i]]=[strip[i],strip[i+1]];if(slotSel===i)slotSel++;renderStrip();}}),
      cnt,btn('×'+it.n,()=>{it.n=REP[(REP.indexOf(it.n)+1)%REP.length];renderStrip();},'srep'));
    colEl.appendChild(hd);
    it.c.forEach((x,k)=>{
      const m=document.createElement('div');m.className='smini';
      const th=document.createElement('canvas');th.width=128;th.height=it.c.length>1?40:72;drawThumb(th,x.card);
      const lb=document.createElement('span');lb.className='sl';lb.textContent=num(x.r);
      m.append(th,lb,
        btn('✕',()=>{it.c.splice(k,1);if(!it.c.length)strip.splice(i,1);renderStrip();},'sx'),
        btn(VOLS[x.v],()=>{x.v=(x.v+1)%3;renderStrip();},'svol'));
      colEl.appendChild(m);
    });
    el.appendChild(colEl);
    if(i<strip.length-1)el.appendChild(btn(it.t?'FADE '+it.t:'CUT',()=>{it.t=TR[(TR.indexOf(it.t)+1)%TR.length];renderStrip();},'str'+(it.t?' on':'')));
    sItems.appendChild(el);
  });
  const loops=strip.reduce((a,it,i)=>a+it.n+(i<strip.length-1?it.t/4:0),0),sec=Math.round(loops*LOOP);
  $('sLen').textContent=strip.length?Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):'';
}
const songItems=()=>strip.map((s,i)=>({c:s.c.map(x=>[x.r,x.v]),n:s.n,t:i<strip.length-1?s.t:0}));
$('sRand').onclick=async()=>{
  try{
    const it=await LIB.randomRecipes(9);if(!it.length){toast('LIBRARY IS EMPTY');return;}
    let i=0;
    while(i<it.length&&strip.length<64){
      const r=it[i++];cardIndex[r.id]=r.card;
      strip.push({c:[{r:r.id,v:2,card:r.card}],n:REP[(Math.random()*3)|0],t:TR[(Math.random()*TR.length)|0]});
      const sl=strip[strip.length-1],r2=it[i];
      if(r2&&Math.random()<.35&&r2.id!==r.id&&slotLayers(sl)+r2.card.length<=CAP){cardIndex[r2.id]=r2.card;sl.c.push({r:r2.id,v:1,card:r2.card});i++;}
    }
    slotSel=strip.length-1;renderStrip();sItems.scrollLeft=sItems.scrollWidth;
  }catch(e){toast(e.message);}
};
$('sPlay').onclick=()=>{if(!strip.length){toast('ADD CARDS FIRST');return;}startSong(songItems(),'YOUR SONG');};
$('sClr').onclick=()=>{strip=[];slotSel=-1;renderStrip();};
$('sSave').onclick=async()=>{
  if(!strip.length){toast('ADD CARDS FIRST');return;}
  $('sSave').disabled=true;
  try{const id=await LIB.saveSong(songItems(),strip.map(s=>s.c.map(x=>(x.card[0]||[0,0,0,0,0])[4])));toast('SAVED · SONG '+num(id));}
  catch(e){toast('NOT SAVED · '+e.message);}
  setTimeout(()=>$('sSave').disabled=false,2500);
};
libEl.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('libClose').onclick=closeLib;
$('bLib').onclick=openLib;
$('bSave').onclick=async()=>{
  if(!events.length){toast('MAKE A LOOP FIRST');return;}
  const b=$('bSave');b.disabled=true;
  try{const id=await LIB.saveRecipe(encodeRecipe(events));toast('SAVED · FRACTURE '+num(id)+(LIB.shared?'':' · THIS DEVICE'));}
  catch(e){toast('NOT SAVED · '+e.message);}
  setTimeout(()=>b.disabled=false,2500);
};
let sortOn=false;
function initSort(){if(sortOn||!window.Sortable)return;sortOn=true;try{Sortable.create(sItems,{animation:150,delay:180,delayOnTouchOnly:true,filter:'button',preventOnFilter:false,draggable:'.scard',
  onEnd:ev=>{if(ev.oldIndex===ev.newIndex)return;const m=strip.splice(ev.oldIndex,1)[0];strip.splice(ev.newIndex,0,m);slotSel=ev.newIndex;renderStrip();}});}catch(_){}}
renderStrip();

/* a shared song link (?song=12) waits for one tap, because browsers only start sound after a tap */
/* ---- endless: keeps pulling random recipes from the library, forever, with fades between them ---- */
function genItems(list){
  const out=[];
  for(let i=0;i<list.length;i++){
    const r=list[i],it={c:[[r.id,2]],n:1+((Math.random()*2)|0),t:[4,4,8,8,16,0][(Math.random()*6)|0]},r2=list[i+1];
    if(r2&&Math.random()<.3&&r2.id!==r.id&&(r.card||[]).length+(r2.card||[]).length<=CAP){it.c.push([r2.id,1]);i++;}
    out.push(it);
  }
  return out;
}
async function extendEndless(){
  const S=song;if(!S||!S.endless||S.fetching)return;S.fetching=true;
  try{
    let list=await LIB.randomRecipes(8);
    const fresh=list.filter(r=>!S.recent.includes(r.id));if(fresh.length>=2)list=fresh;
    const items=genItems(list);if(!items.length)return;
    const recs=await LIB.recipes(items.flatMap(i=>i.c.map(c=>c[0])));
    if(song!==S)return;
    const last=S.items[S.items.length-1];
    S.segs.push(...buildSegs([last].concat(items),recs,true));
    S.items=[last].concat(items).slice(-3);
    items.forEach(i=>i.c.forEach(c=>S.recent.push(c[0])));S.recent=S.recent.slice(-10);
    if(S.i>24){S.segs.splice(0,S.i-1);S.i=1;}                     /* forget loops already played so hours of play stay light */
  }catch(e){console.warn('endless',e);}
  finally{S.fetching=false;}
}
async function startEndless(){
  try{initAudio();if(AC&&AC.state!=='running')AC.resume();}catch(_){}
  let list;
  try{toast('LOADING…');list=await LIB.randomRecipes(8);}catch(e){toast('LIBRARY OFFLINE · '+e.message);return;}
  if(!list.length){toast('LIBRARY IS EMPTY');return;}
  await startSong(genItems(list),'ENDLESS',true);
  if(song&&song.endless)song.recent=list.map(r=>r.id);
}
$('libEndless').onclick=startEndless;
let pendingEndless=QS.has('endless');
if(pendingEndless){hint.innerHTML='<b>FRACTURE</b><span>tap to start · endless</span>';}
let pendingSong=QS.get('song')?+QS.get('song'):0;
if(pendingSong){hint.innerHTML='<b>FRACTURE</b><span>tap to watch song '+num(pendingSong)+'</span>';}
async function playPending(){
  const id=pendingSong;pendingSong=0;
  try{initAudio();if(AC&&AC.state!=='running')AC.resume();}catch(_){}
  try{const s=await LIB.song(id);startSong(s.items,'SONG '+num(id));}catch(e){toast('SONG '+num(id)+' NOT FOUND');hint.innerHTML='<b>FRACTURE</b><span>press · hold · touch</span>';}
}

/* ===== main loop ===== */
/* adaptive detail: if the page stays below ~22 fps for 3 s, draw the canvas at a lower resolution
   (1600 -> 1200 -> 900 on the long edge). timing and sound are unaffected; the picture just gets softer. */
let slowSince=0;
function qualityCheck(now){
  if(fms<45||held.size||exp||simLong<=900){slowSince=0;return;}
  if(!slowSince){slowSince=now;return;}
  if(now-slowSince<3)return;
  slowSince=0;simLong=simLong>1200?1200:900;K=simLong/1600;
  clearWorld();frs=frs.filter(f=>f.live);resize();
}
let lastFrameT=0,fms=16,beatLvl=0;const beatEl=$('beat');
let lastResume=0;
function frame(){
  requestAnimationFrame(frame);
  try{
  const now=performance.now()/1000;
  if(AC&&AC.state!=='running'&&now-lastResume>1){lastResume=now;try{AC.resume();}catch(_){}}
  sched();
  if(lastFrameT){fms=fms*.9+(now-lastFrameT)*1000*.1;}lastFrameT=now;
  budget=fms>48?1:fms>32?2:3;
  rbudget=fms>50?2:fms>34?4:fms>24?7:10;
  qualityCheck(now);      /* slow device: fewer glitches per frame so it stays playable */
  if(AC){
    const ac=AC.currentTime;
    const lat=AC.outputLatency||AC.baseLatency||0;
    while(mvq.length&&mvq[0].t+lat<=ac){const b=mvq.shift();if(metOn)beatLvl=b.f?1:b.a?.75:.4;}
    while(vq.length&&vq[0].t<=ac){const e=vq.shift();if(ac-e.t<.5&&e.vis)spawnReplay(e.ev);}
  }
  if(++fcount%(fms>40?8:4)===0)fadePass();
  syncSnap();
  for(let i=0;i<frs.length;i++){try{frs[i].step(now);}catch(e){frs[i].done=true;console.warn('fracture error',e);}}
  if(frs.some(f=>f.done))frs=frs.filter(f=>!f.done);
  if(shake>.3){cv.style.transform='translate('+((rnd()-.5)*shake).toFixed(1)+'px,'+((rnd()-.5)*shake).toFixed(1)+'px)';shake*=.88;}
  else if(shake){shake=0;cv.style.transform='';}
  if(exp&&AC){
    const ac=AC.currentTime;
    if(exp.state==='armed'){
      if(ac>=exp.start-.04){
        exp.mr.start(250);exp.state='rec';
      }else $('bRec').textContent='◌ STARTS IN '+Math.ceil(exp.start-ac)+'s';
    }
    exp.rctx.drawImage(cv,0,0,exp.rc.width,exp.rc.height);
    if(exp.state==='rec'){
      $('bRec').textContent='● PASS '+clamp(1+Math.floor((ac-exp.start)/LOOP),1,4)+'/4';
      if(ac>=exp.end)endExport();
    }
  }
  beatLvl*=.82;beatEl.style.opacity=beatLvl>.03?beatLvl.toFixed(2):0;
  if(song){
    $('wInfo').textContent=songStatus();
    if(song.endT!==null&&AC&&AC.currentTime>song.endT+1.5)$('wAgain').style.display='';
  }
  info.textContent=Math.round(1000/fms)+' FPS · RES '+simLong+' · '+BPM+' BPM · 4 BARS · LAYERS '+events.length+'/'+MAXV+' · C heal · M sound · K click · R mp4 · E jpg · 0-9 type';
  }catch(e){console.warn('frame error',e);}
}
requestAnimationFrame(frame);
})();
