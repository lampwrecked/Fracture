# Sends worker/worker.js to Cloudflare whenever it changes on main (or when run by hand from the Actions tab).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare "Edit Cloudflare Workers" token).
name: Deploy library Worker
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the key is set
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: test -n "$T" || (echo "Add the CLOUDFLARE_API_TOKEN secret in repo Settings → Secrets and variables → Actions" && exit 1)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
